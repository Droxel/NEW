<svg width="100" height="100" viewBox="0 0 64 64"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- Анимированный радужный градиент -->
    <linearGradient id="rainbowGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF00FB">
        <animate attributeName="stop-color"
                 values="#FF00FB;#00E5FF;#70FF00;#FFFB00;#FF00FB"
                 dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#00E5FF">
        <animate attributeName="stop-color"
                 values="#00E5FF;#70FF00;#FFFB00;#FF00FB;#00E5FF"
                 dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Внутреннее мягкое свечение -->
    <radialGradient id="brightGlow" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="white" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#A0E9FF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FF00FB" stop-opacity="0.08"/>
    </radialGradient>

    <!-- Glow фильтр -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.2"/>
    </filter>
  </defs>

  <!-- Группа с правильной пульсацией -->
  <g>
    <animateTransform attributeName="transform"
                      type="translate"
                      values="0 0; 0 0"
                      dur="2s"
                      repeatCount="indefinite"/>

    <animateTransform attributeName="transform"
                      type="scale"
                      values="1;1.04;1"
                      dur="2s"
                      repeatCount="indefinite"
                      additive="sum"/>

    <!-- Основное тело -->
    <circle cx="32" cy="32" r="26"
            fill="url(#brightGlow)"/>

    <!-- Переливающийся контур -->
    <circle cx="32" cy="32" r="26"
            stroke="url(#rainbowGradient)"
            stroke-width="2.5"
            fill="none"
            filter="url(#glow)">
      <animate attributeName="stroke-width"
               values="2;3;2"
               dur="1.5s"
               repeatCount="indefinite"/>
    </circle>

    <!-- Блики -->
    <path d="M20 18C20 14 25 12 30 12"
          stroke="white"
          stroke-width="3"
          stroke-linecap="round"
          stroke-opacity="0.8"/>

    <circle cx="21" cy="16" r="2"
            fill="white"
            fill-opacity="0.9"/>

    <!-- Нижний радужный рефлекс -->
    <ellipse cx="32" cy="48"
             rx="12" ry="5"
             fill="url(#rainbowGradient)"
             opacity="0.35"
             filter="url(#glow)"/>
  </g>

</svg>