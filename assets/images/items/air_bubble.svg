<svg width="240" height="240" viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">

  <style>
    /* Анимация покачивания всей сферы */
    @keyframes float {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-3px); }
      100% { transform: translateY(0px); }
    }
    .aqualung-group {
      animation: float 4s ease-in-out infinite;
      transform-origin: center;
    }

    /* Пульсация неонового свечения */
    @keyframes pulse {
      0% { opacity: 0.5; }
      50% { opacity: 0.9; }
      100% { opacity: 0.5; }
    }
    .neon-glow-effect {
      animation: pulse 2s ease-in-out infinite;
    }

    /* Анимация движения пузырьков вверх */
    @keyframes floatUp {
      0% { transform: translateY(15px); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-20px); opacity: 0; }
    }
    .bubble-1 { animation: floatUp 3s linear infinite; }
    .bubble-2 { animation: floatUp 4s linear infinite 1s; }
    .bubble-3 { animation: floatUp 2.5s linear infinite 0.5s; }
    .bubble-4 { animation: floatUp 3.5s linear infinite 1.8s; }
  </style>

  <defs>
    <!-- Неоновое свечение -->
    <filter id="neon-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#00f0ff" flood-opacity="0.6"/>
    </filter>
    
    <!-- Стекло шлема -->
    <radialGradient id="glass-sphere" cx="40%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#3ad7ff" stop-opacity="0.2"/>
      <stop offset="85%" stop-color="#006699" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#002244" stop-opacity="0.8"/>
    </radialGradient>

    <!-- Металл креплений -->
    <linearGradient id="cyber-metal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#8ba3b5"/>
      <stop offset="70%" stop-color="#415360"/>
      <stop offset="100%" stop-color="#1a242c"/>
    </linearGradient>
  </defs>

  <!-- Обертка для анимации покачивания -->
  <g class="aqualung-group">
    
    <!-- ТЕХНО-КРЕПЛЕНИЯ И КЛАПАНЫ -->
    <rect x="52" y="102" width="16" height="12" rx="3" fill="url(#cyber-metal)"/>
    <circle cx="60" cy="111" r="3" fill="#ff3366" class="neon-glow-effect" filter="url(#neon-glow)"/>
    <path d="M12 60 L6 60 M108 60 L114 60 M60 12 L60 6" stroke="url(#cyber-metal)" stroke-width="3" stroke-linecap="round"/>

    <!-- ОСНОВНАЯ СФЕРА (Стекло с неоновым контуром) -->
    <circle cx="60" cy="60" r="48" fill="url(#glass-sphere)" stroke="#00f0ff" stroke-width="2.5" filter="url(#neon-glow)"/>

    <!-- ВНУТРЕННЯЯ СИСТЕМА ФИЛЬТРАЦИИ И КИСЛОРОД -->
    <!-- Анимированные пузырьки воздуха -->
    <g transform-origin="60 60">
      <g class="bubble-1">
        <circle cx="45" cy="75" r="5" fill="#ffffff" filter="url(#neon-glow)"/>
        <circle cx="43" cy="73" r="1.5" fill="#3ad7ff"/>
      </g>
      <circle class="bubble-2" cx="75" cy="70" r="4" fill="#ffffff"/>
      <circle class="bubble-3" cx="55" cy="65" r="3" fill="#ffffff"/>
      <circle class="bubble-4" cx="70" cy="75" r="2" fill="#ffffff"/>
    </g>

    <!-- Цифровой индикатор О2 внутри -->
    <path d="M34 55 L42 55 M34 59 L46 59" stroke="#00f0ff" stroke-width="1.5" stroke-linecap="round" class="neon-glow-effect" opacity="0.7"/>

    <!-- ЭФФЕКТЫ БЛИКОВ -->
    <path d="M26 40 A 38 38 0 0 1 70 20 A 44 44 0 0 0 32 34 Z" fill="#ffffff" opacity="0.4"/>
    <circle cx="36" cy="34" r="6" fill="#ffffff" opacity="0.5"/>
    <path d="M30 88 A 40 40 0 0 0 90 88 A 43 43 0 0 1 30 88 Z" fill="#ffffff" opacity="0.25"/>

  </g>
</svg>