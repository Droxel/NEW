<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bubbleGradient" cx="50%" cy="50%" r="50%" fx="35%" fy="35%">
      <stop offset="0%" stop-color="#e0f7fa" stop-opacity="0.2" />
      <stop offset="70%" stop-color="#81d4fa" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#4fc3f7" stop-opacity="0.5" />
    </radialGradient>
  </defs>

  <!-- Группа для общей пульсации -->
  <g style="transform-origin: center;">
    <animateTransform attributeName="transform"
                      type="scale"
                      values="1; 1.05; 1"
                      dur="3s"
                      repeatCount="indefinite"
                      calcMode="spline"
                      keySplines="0.4 0 0.2 1; 0.4 0 0.2 1" />

    <!-- Тело пузыря -->
    <circle cx="32" cy="32" r="28" 
            fill="url(#bubbleGradient)" 
            stroke="#e0f2f1" 
            stroke-width="1.5" 
            opacity="0.7" />

    <!-- Лапка -->
    <g fill="white" opacity="0.4">
      <circle cx="24" cy="28" r="3" />
      <circle cx="32" cy="24" r="3.5" />
      <circle cx="40" cy="28" r="3" />
      <path d="M24 38 Q24 32 32 32 Q40 32 40 38 Q40 46 32 46 Q24 46 24 38 Z" />
    </g>

    <!-- Блик -->
    <ellipse cx="22" cy="18" rx="7" ry="3.5"
             fill="white" opacity="0.3"
             transform="rotate(-30 22 18)" />

    <!-- Внешняя аура -->
    <circle cx="32" cy="32" r="30"
            fill="none"
            stroke="#b2ebf2"
            stroke-width="1"
            opacity="0.2" />
  </g>
</svg>