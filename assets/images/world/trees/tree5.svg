<svg
  width="200"
  height="300"
  viewBox="0 0 200 300"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- 🌳 Толстый ствол ивы (ровное основание, лёгкий изгиб) -->
  <path
    d="
      M80 300
      C75 260, 70 220, 72 180
      C74 140, 80 105, 90 80

      C95 70, 105 70, 110 80

      C120 105, 126 140, 128 180
      C130 220, 125 260, 120 300
      Z
    "
    fill="#4a5b4f"
    stroke="#2f3a33"
    stroke-width="3"
  />

  <!-- 🌿 Крона ивы -->
  <ellipse cx="100" cy="70" rx="70" ry="32" fill="#3f6b4f"/>
  <ellipse cx="55"  cy="80" rx="45" ry="28" fill="#356a4a"/>
  <ellipse cx="145" cy="80" rx="45" ry="28" fill="#356a4a"/>

  <!-- 🌾 Свисающие ветви -->
  <path d="M40 90 C48 150, 52 220, 50 280" stroke="#2f6f4f" stroke-width="4" fill="none"/>
  <path d="M65 95 C70 160, 75 230, 72 295" stroke="#3a8f63" stroke-width="4" fill="none"/>
  <path d="M90 100 C95 165, 100 235, 98 300" stroke="#2f6f4f" stroke-width="4" fill="none"/>

  <path d="M110 100 C105 165, 100 235, 102 300" stroke="#2f6f4f" stroke-width="4" fill="none"/>
  <path d="M135 95 C130 160, 125 230, 128 295" stroke="#3a8f63" stroke-width="4" fill="none"/>
  <path d="M160 90 C152 150, 148 220, 150 280" stroke="#2f6f4f" stroke-width="4" fill="none"/>

  <!-- 🪢 Лианы -->
  <path d="M75 85 C68 135, 70 190, 65 250" stroke="#6b8f5a" stroke-width="3" fill="none"/>
  <path d="M125 85 C132 135, 130 190, 135 250" stroke="#6b8f5a" stroke-width="3" fill="none"/>

</svg>