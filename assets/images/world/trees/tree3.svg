<svg
  width="120"
  height="170"
  viewBox="0 0 120 170"
  xmlns="http://www.w3.org/2000/svg"
>

  <!-- Ствол (прямой сверху, без закругления) -->
  <rect
    x="50"
    y="135"
    width="20"
    height="35"
    rx="0"
    fill="#5a3b22"
  />

  <!-- Нижний слой (зелень у ствола) -->
  <polygon
    points="60,80 15,135 105,135"
    fill="#2f6b3f"
  />

  <!-- Снег -->
  <polygon
    points="60,65 10,125 110,125"
    fill="#f5f7fa"
  />

  <!-- Средний слой -->
  <polygon
    points="60,45 25,95 95,95"
    fill="#2f6b3f"
  />

  <!-- Снег -->
  <polygon
    points="60,30 20,85 100,85"
    fill="#ffffff"
  />

  <!-- Верхушка -->
  <polygon
    points="60,15 45,50 75,50"
    fill="#ffffff"
  />

</svg>