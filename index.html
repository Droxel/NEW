<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Игра</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="loading-screen">
    <h2 id="loader-title">Загрузка игры...</h2>
    <div class="loader-bar-container">
      <div id="loader-fill"></div>
    </div>
    <div id="status-message" class="status-text">Проверка ресурсов...</div>
  </div>

  <div id="main-menu" class="hidden">
    <div class="menu-content" id="menu-main">
        <h1 style="color: white; margin-bottom: 30px; letter-spacing: 2px;">Terraria Clone</h1>
        <button id="btn-play" class="menu-btn">ВЫБРАТЬ МИР</button>
        <button id="btn-create-menu" class="menu-btn">СОЗДАТЬ МИР</button>
        <button id="btn-settings" class="menu-btn" style="opacity: 0.5; cursor: default;">НАСТРОЙКИ</button>
    </div>

    <div class="menu-content hidden" id="menu-select-world">
        <h2 style="color: white;">Выбор мира</h2>
        <div id="worlds-list" style="max-height: 200px; overflow-y: auto; color: white; margin-bottom: 15px;"></div>
        <button id="btn-back-from-select" class="menu-btn" style="background: #e74c3c;">НАЗАД</button>
    </div>

    <div class="menu-content hidden" id="menu-create-world">
        <h2 style="color: white;">Новый мир</h2>
        <div style="display: flex; gap: 10px; align-items: center; justify-content: center; margin-bottom: 15px;">
             <input type="text" id="input-world-name" placeholder="Название мира" class="menu-input">
        </div>
        <input type="number" id="input-world-seed" placeholder="Сид (рандом, если пусто)" class="menu-input" style="margin-bottom: 20px;">
        <div style="display: flex; gap: 10px;">
            <button id="btn-create-confirm" class="menu-btn">СОЗДАТЬ</button>
            <button id="btn-back-from-create" class="menu-btn" style="background: #e74c3c;">ОТМЕНА</button>
        </div>
    </div>
  </div>
</div> <div id="game-over-screen" style="
      position: fixed; 
      top: 0; left: 0; 
      width: 100%; height: 100%; 
      background: rgba(138, 3, 3, 0.8); 
      color: white; 
      display: none; /* Важно: через JS будем менять на flex */
      flex-direction: column; 
      align-items: center; 
      justify-content: center; 
      z-index: 99999;">
      <h1 style="font-size: 60px; text-shadow: 2px 2px 10px black;">ВЫ ПОГИБЛИ</h1>
      <button id="btn-respawn" class="menu-btn" style="background: #27ae60; margin-bottom: 10px;">ВОЗРОДИТЬСЯ</button>
      <button id="btn-to-menu" class="menu-btn" style="background: #e74c3c;">В МЕНЮ</button>
  </div>

  <div class="game-wrapper">
  <div class="game-wrapper">
      <div class="game-box">
          <canvas id="game"></canvas>
          
          <div id="health-ui"></div>

          <div class="controls" id="game-controls" style="display: none;">
              <div class="move">
                  <button id="left">◀</button>
                  <button id="right">▶</button>
              </div>
              <div class="actions">
                  <button id="heal-btn" class="inactive">🧪</button>
                  <button id="jump">▲</button>
              </div>
          </div>
          
          <div id="hook-joystick-container" style="position: fixed; bottom: 160px; right: 30px; width: 120px; height: 120px; background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.2); border-radius: 50%; touch-action: none; z-index: 1000; display: none;">
    <div id="hook-joystick-stick" style="position: absolute; top: 35px; left: 35px; width: 50px; height: 50px; background: #5c3a21; border: 2px solid #fff; border-radius: 50%; pointer-events: none;"></div>
</div>
      </div>
  </div>

  <script type="module">
      import { MainMenu } from './src/ui/MainMenu.js';

      const fill = document.getElementById('loader-fill');
      const status = document.getElementById('status-message');

      async function initGame() {
          if(fill) fill.style.width = "100%";
          if(status) status.innerText = "Запуск...";

          setTimeout(() => {
              const loadingScreen = document.getElementById('loading-screen');
              if(loadingScreen) loadingScreen.classList.add('hidden');
              
const menu = new MainMenu(() => {
    console.log("🚀 Старт движка!");
    
    const controls = document.getElementById('game-controls');
    const joystick = document.getElementById('hook-joystick-container'); // Находим джойстик
    
    if (controls) controls.style.display = 'flex';
    if (joystick) joystick.style.display = 'block'; // ВКЛЮЧАЕМ ЕГО ПРИ СТАРТЕ

    if (window.startGame) {
        window.startGame();;
                  } else {
                      // Если main.js еще не загружен (модуль)
                      import('./src/core/main.js').then(m => {
                          if(window.startGame) window.startGame();
                      });
                  }
              });
              menu.show();
          }, 800);
      }
      initGame();
  </script>
</body>
</html>
