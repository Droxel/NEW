<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Конструктор Гиганта (Скелет)</title>
    <style>
        body { 
            background: #1a1a1a; color: white; display: flex; 
            font-family: 'Segoe UI', Tahoma, sans-serif; margin: 0; overflow: hidden; 
        }
        canvas { 
            background: #333; 
            background-image: radial-gradient(#444 1px, transparent 1px); 
            background-size: 20px 20px; cursor: grab; 
        }
        canvas:active { cursor: grabbing; }
        #ui { 
            width: 420px; height: 100vh; overflow-y: auto; 
            background: #252526; padding: 20px; box-sizing: border-box;
            box-shadow: 5px 0 15px rgba(0,0,0,0.5); z-index: 10; 
        }
        #ui::-webkit-scrollbar { width: 8px; }
        #ui::-webkit-scrollbar-track { background: #1e1e1e; }
        #ui::-webkit-scrollbar-thumb { background: #555; border-radius: 4px; }
        
        .part-block { 
            background: #333337; border-radius: 8px; padding: 12px; 
            margin-bottom: 15px; border: 1px solid #444; border-left: 4px solid #00ffcc;
        }
        h2 { color: #00ffcc; font-size: 18px; margin-top: 0; }
        h3 { margin: 0 0 10px 0; color: #569cd6; font-size: 13px; text-transform: uppercase; }
        .parent-badge { font-size: 10px; background: #555; padding: 2px 6px; border-radius: 4px; margin-left: 10px; color: #ccc;}
        .control { display: flex; align-items: center; margin-bottom: 8px; }
        label { width: 90px; font-size: 11px; color: #ccc; }
        input[type="range"] { flex: 1; cursor: pointer; }
        .val-span { width: 45px; text-align: right; font-family: monospace; font-size: 12px; color: #00ffcc; }
        
        button { 
            background: #0e639c; color: white; border: none; width: 100%; 
            padding: 12px; cursor: pointer; border-radius: 4px; font-weight: bold; margin-top: 10px; 
        }
        button:hover { background: #1177bb; }
        .view-controls { background: #1e1e1e; padding: 10px; border-radius: 8px; margin-bottom: 20px; border: 1px dashed #555; }
        .hint { font-size: 11px; color: #888; margin-top: 5px; text-align: center; }
        .checkbox-label { display: flex; align-items: center; cursor: pointer; color: #00ffcc; font-weight: bold; font-size: 14px;}
        .checkbox-label input { margin-right: 10px; width: 18px; height: 18px;}
    </style>
</head>
<body>

<div id="ui">
    <h2>Настройка моба</h2>
    
    <div class="view-controls">
        <label class="checkbox-label">
            <input type="checkbox" id="showSkeleton" checked>
            Показывать скелет (суставы и связи)
        </label>
        <div class="hint">Красные точки - суставы.<br>Голубые линии - связь с родителем.</div>
    </div>

    <div id="controls-container"></div>
    <button onclick="copyToClipboard()">Скопировать код для GiantMob.js</button>
</div>

<canvas id="canvas"></canvas>

<script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const showSkeletonBtn = document.getElementById('showSkeleton');

    let camera = { x: 0, y: -100, zoom: 1 };

    function resizeCanvas() {
        canvas.width = window.innerWidth - 420;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const translate = {
        body: "Туловище", head: "Голова",
        armL: "Левое Плечо", fistL: "Левый Кулак",
        armR: "Правое Плечо", fistR: "Правый Кулак",
        legL: "Левая Нога", footL: "Кулак-Ступня L",
        legR: "Правая Нога", footR: "Кулак-Ступня R"
    };

    // Заглушки картинок для конструктора
    const assets = {
        giant_head: new Image(), giant_body: new Image(),
        giant_arm: new Image(), giant_fist: new Image()
    };
    assets.giant_head.src = "assets/images/entities/mobs/head_giant.png";
    assets.giant_body.src = "assets/images/entities/mobs/body_giant.png";
    assets.giant_arm.src  = "assets/images/entities/mobs/arm_giant.png";
    assets.giant_fist.src = "assets/images/entities/mobs/fist.png";

    // НОВАЯ СТРУКТУРА: добавились parent, jx, jy, angle
    // jx, jy - координаты сустава внутри самой картинки (0 до width/height)
    // ox, oy - смещение сустава относительно РОДИТЕЛЬСКОГО сустава
    let parts = {
        body:  { name: 'giant_body', parent: null,   ox: 0,   oy: 0,   w: 150, h: 200, jx: 75, jy: 100, angle: 0 },
        head:  { name: 'giant_head', parent: 'body', ox: 0,   oy: -80, w: 100, h: 100, jx: 50, jy: 80,  angle: 0 },
        
        armL:  { name: 'giant_arm',  parent: 'body', ox: -60, oy: -60, w: 60,  h: 130, jx: 30, jy: 20,  angle: 0 },
        fistL: { name: 'giant_fist', parent: 'armL', ox: 0,   oy: 100, w: 90,  h: 70,  jx: 45, jy: 15,  angle: 0 },
        
        armR:  { name: 'giant_arm',  parent: 'body', ox: 60,  oy: -60, w: 60,  h: 130, jx: 30, jy: 20,  angle: 0 },
        fistR: { name: 'giant_fist', parent: 'armR', ox: 0,   oy: 100, w: 90,  h: 70,  jx: 45, jy: 15,  angle: 0 },
        
        legL:  { name: 'giant_arm',  parent: 'body', ox: -35, oy: 80,  w: 60,  h: 130, jx: 30, jy: 20,  angle: 0 },
        footL: { name: 'giant_fist', parent: 'legL', ox: 0,   oy: 100, w: 90,  h: 70,  jx: 45, jy: 35,  angle: 0 },
        
        legR:  { name: 'giant_arm',  parent: 'body', ox: 35,  oy: 80,  w: 60,  h: 130, jx: 30, jy: 20,  angle: 0 },
        footR: { name: 'giant_fist', parent: 'legR', ox: 0,   oy: 100, w: 90,  h: 70,  jx: 45, jy: 35,  angle: 0 }
    };

    const drawOrder = ['legL','legR','body','head','armL','armR','footL','footR','fistL','fistR'];

    // Генерация UI
    const container = document.getElementById('controls-container');
    drawOrder.forEach(key => {
        let block = document.createElement('div');
        block.className = 'part-block';
        let parentText = parts[key].parent ? `<span class="parent-badge">🔗 Привязан к: ${parts[key].parent}</span>` : `<span class="parent-badge">👑 Основа (Корень)</span>`;
        block.innerHTML = `<h3>${translate[key] || key} ${parentText}</h3>`;
        
        const controls = [
            { prop: 'angle', label: 'Поворот °', min: -180, max: 180 },
            { prop: 'ox', label: 'Сдвиг от род. X', min: -300, max: 300 },
            { prop: 'oy', label: 'Сдвиг от род. Y', min: -300, max: 300 },
            { prop: 'jx', label: 'Сустав внутри X', min: 0, max: 300 },
            { prop: 'jy', label: 'Сустав внутри Y', min: 0, max: 300 },
            { prop: 'w', label: 'Ширина', min: 10, max: 400 },
            { prop: 'h', label: 'Высота', min: 10, max: 400 }
        ];

        controls.forEach(c => {
            let div = document.createElement('div');
            div.className = 'control';
            div.innerHTML = `
                <label>${c.label}:</label>
                <input type="range" min="${c.min}" max="${c.max}" value="${parts[key][c.prop]}" data-part="${key}" data-prop="${c.prop}">
                <span class="val-span">${parts[key][c.prop]}</span>
            `;
            block.appendChild(div);
        });
        container.appendChild(block);
    });

    container.addEventListener('input', (e) => {
        if (e.target.tagName !== 'INPUT') return;
        const { part, prop } = e.target.dataset;
        const val = parseInt(e.target.value);
        parts[part][prop] = val;
        e.target.nextElementSibling.innerText = val;
    });

    // Камера
    let isDragging = false, lastMouse = { x: 0, y: 0 };
    canvas.addEventListener('mousedown', e => { isDragging = true; lastMouse = { x: e.clientX, y: e.clientY }; });
    window.addEventListener('mouseup', () => isDragging = false);
    window.addEventListener('mousemove', e => {
        if (!isDragging) return;
        camera.x += (e.clientX - lastMouse.x) / camera.zoom;
        camera.y += (e.clientY - lastMouse.y) / camera.zoom;
        lastMouse = { x: e.clientX, y: e.clientY };
    });
    canvas.addEventListener('wheel', e => {
        e.preventDefault();
        camera.zoom = Math.max(0.1, Math.min(3, camera.zoom + (e.deltaY < 0 ? 0.1 : -0.1)));
    });

    // --- МАГИЯ СКЕЛЕТНОЙ АНИМАЦИИ ---
    
    // Эта функция проходит по "предкам" детали и сдвигает холст, 
    // чтобы деталь нарисовалась точно там, где у родителя сустав
    function applyTransform(partKey) {
        const p = parts[partKey];
        if (p.parent) {
            applyTransform(p.parent); // Сначала применяем сдвиг родителя
        }
        ctx.translate(p.ox, p.oy); // Двигаемся к точке крепления
        ctx.rotate(p.angle * Math.PI / 180); // Поворачиваем сустав
    }

    function draw() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.scale(camera.zoom, camera.zoom);
        ctx.translate(camera.x, camera.y);

        // 1. Рисуем сами картинки (Тело моба)
        drawOrder.forEach(key => {
            const p = parts[key];
            const img = assets[p.name];
            
            ctx.save(); // Сохраняем холст
            applyTransform(key); // Вычисляем позицию относительно родителей
            
            if (img.complete && img.naturalHeight !== 0) {
                // Рисуем картинку так, чтобы её jx, jy оказались ровно в центре (0,0)
                ctx.drawImage(img, -p.jx, -p.jy, p.w, p.h);
            } else {
                ctx.fillStyle = "rgba(255, 0, 255, 0.4)";
                ctx.fillRect(-p.jx, -p.jy, p.w, p.h);
                ctx.strokeStyle = "rgba(255, 255, 255, 0.5)";
                ctx.strokeRect(-p.jx, -p.jy, p.w, p.h);
                ctx.fillStyle = "white"; ctx.font = "10px sans-serif";
                ctx.fillText(key, -p.jx + 5, -p.jy + 15);
            }
            ctx.restore(); // Возвращаем холст обратно для следующей детали
        });

        // 2. Рисуем Скелет поверх моба (если галочка стоит)
        if (showSkeletonBtn.checked) {
            // Рисуем линии (кости)
            drawOrder.forEach(key => {
                const p = parts[key];
                if (p.parent) {
                    ctx.save();
                    applyTransform(p.parent); // Встаем в сустав родителя
                    ctx.beginPath();
                    ctx.moveTo(0, 0); // От сустава родителя
                    ctx.lineTo(p.ox, p.oy); // До сустава ребенка
                    ctx.strokeStyle = '#00ffcc';
                    ctx.lineWidth = 3;
                    ctx.stroke();
                    ctx.restore();
                }
            });
            
            // Рисуем точки (суставы)
            drawOrder.forEach(key => {
                ctx.save();
                applyTransform(key);
                ctx.beginPath();
                ctx.arc(0, 0, 6, 0, Math.PI * 2);
                ctx.fillStyle = '#ff0055'; // Красный сустав
                ctx.fill();
                ctx.strokeStyle = 'white';
                ctx.lineWidth = 2;
                ctx.stroke();
                ctx.restore();
            });
        }

        // Земля
        ctx.strokeStyle = "#444"; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(-1000, 200); ctx.lineTo(1000, 200); ctx.stroke();

        ctx.restore();
        requestAnimationFrame(draw);
    }

    function copyToClipboard() {
        let exportParts = JSON.parse(JSON.stringify(parts));
        let code = `this.parts = ${JSON.stringify(exportParts, null, 4)};\n\nthis.drawOrder = ${JSON.stringify(drawOrder)};`;
        
        navigator.clipboard.writeText(code).then(() => {
            const btn = document.querySelector('button');
            const originalText = btn.innerText;
            btn.innerText = "Скопировано!"; btn.style.background = "#28a745";
            setTimeout(() => { btn.innerText = originalText; btn.style.background = ""; }, 1500);
        }).catch(() => alert("Скопировано!"));
    }

    requestAnimationFrame(draw);
</script>
</body>
</html>
